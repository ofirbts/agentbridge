name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
